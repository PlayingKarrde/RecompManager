# Researched 2026-11-07 from the README and release 9.3.1. See docs/games/shipwright.md.
id: shipwright
name: Ship of Harkinian
description: >-
  PC port of Ocarina of Time built on the decompilation. Turns your ROM into an
  .o2r archive (oot.o2r, and oot-mq.o2r for Master Quest) on first launch.
game:
  id: ocarina-of-time
  title: 'The Legend of Zelda: Ocarina of Time'
  system: n64
source:
  type: github
  repo: HarbourMasters/Shipwright
  channel: stable
  auto_update: true
assets:
  # Release names are codenamed (SoH-Dewey-Bravo-Win64.zip), so rules match the end.
  windows-x64: { match: '(?i)-Win64\.zip$' }
  macos-universal: { match: '(?i)-Mac\.zip$' }  # contains SoH.dmg
  # Linux moved from SoH-<codename>-Linux.zip (9.2.x) to SoH-<codename>.appimage (9.3+).
  linux-x64: { match: '(?i)(\.appimage|-Linux\.zip)$' }
input:
  kind: file
  description: >-
    Ocarina of Time ROM. A normal ROM makes oot.o2r; a Master Quest ROM makes
    oot-mq.o2r. One or both.
  slots:
    - id: oot
      kind: file
      description: Ocarina of Time ROM (any supported version)
      verify:
        hashes_url: https://raw.githubusercontent.com/HarbourMasters/Shipwright/develop/docs/supportedHashes.json
        hash_name_pattern: '^(?!.*\bMQ\b)'  # any supported ROM that isn't Master Quest
    - id: oot-mq
      kind: file
      optional: true
      description: Ocarina of Time Master Quest ROM
      verify:
        hashes_url: https://raw.githubusercontent.com/HarbourMasters/Shipwright/develop/docs/supportedHashes.json
        hash_name_pattern: '\bMQ\b'
# The server makes oot.o2r / oot-mq.o2r once per SoH version (they're tied to the
# version) and every platform gets them; no device needs the ROM.
extract:
  builder: soh-extract
  release_platform: linux-x64  # the AppImage does the extraction
  command: [/builder/extract.sh]
  inputs: [oot, oot-mq]  # oot-mq is optional
  outputs: ['oot*.o2r']
  memory_gb: 4
  timeout_minutes: 30
platforms:
  windows-x64:
    strategy: server_extract
    steps:
      - download_artifact: { to: '{install}', extract: true }  # soh.exe at the zip's root
      - place_output: { name: 'oot*.o2r', to: '{install}' }
    fallback:
      strategy: runtime
      steps:
        - download_artifact: { to: '{install}', extract: true }
        - place_input: { slot: oot, to: '{install}/oot.z64' }
  linux-x64:
    strategy: server_extract
    steps:
      - download_artifact: { to: '{install}/soh.appimage' }
      - chmod: { path: '{install}/soh.appimage', mode: '755' }
      - place_output: { name: 'oot*.o2r', to: '{install}' }
    fallback:
      strategy: runtime
      steps:
        - download_artifact: { to: '{install}/soh.appimage' }
        - chmod: { path: '{install}/soh.appimage', mode: '755' }
        - place_input: { slot: oot, to: '{install}/oot.z64' }
  macos-universal:
    strategy: server_extract
    notes: >-
      The macOS zip holds SoH.dmg: open it and drag soh.app to Applications. The
      .o2r files are already in place, so soh.app won't ask for a ROM.
    steps:
      - download_artifact: { to: '{install}', extract: true }
      - place_output:
          name: 'oot*.o2r'
          to: '{home}/Library/Application Support/com.shipofharkinian.soh'
      - instructions:
          markdown: >-
            Open **SoH.dmg** in `{install}` and drag **soh.app** to Applications.
    fallback:
      strategy: manual
      notes: >-
        The macOS zip holds SoH.dmg. Copy soh.app out of it, open it and pick your
        ROM when asked. The .o2r goes to ~/Library/Application Support/com.shipofharkinian.soh/.
      steps:
        - download_artifact: { to: '{install}', extract: true }
saves:
  windows-x64: '{install}'
  # Uses the launch folder if it already holds shipofharkinian.json or an .o2r;
  # otherwise ~/.local/share/soh. SHIP_HOME overrides both.
  linux-x64: '{install}'
  macos-universal: '{home}/Library/Application Support/com.shipofharkinian.soh'
launch:
  windows-x64: { exe: 'soh.exe' }
  linux-x64: { exe: 'soh.appimage', env: { SHIP_HOME: '{install}' } }
  macos-universal: { exe: 'soh.app' }
unverified:
  - input.placement.windows-x64  # README doesn't say where Windows looks for the ROM
  - input.placement.linux-x64  # ROM next to the AppImage; README says "when prompted, select"
  - saves.windows-x64
  - launch.macos-universal
  - extract  # runs the AppImage under Xvfb; not yet run against a real ROM
notes: >-
  Config is shipofharkinian.json next to the executable. Mods (.otr/.o2r) go in
  mods/. The generated .o2r files work on every platform (the Switch port says to
  generate them on PC), so the server makes them once per version.
  CI nightlies also exist for Linux ARM (soh-linux-aarch64.zip) but releases
  don't include an arm64 build.
