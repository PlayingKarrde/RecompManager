# Researched 2026-11-07 from the README, docs/building.md, docs/recomp-save-contract.md
# and release v0.6.2. See docs/games/doaxvb-re.md.
id: doaxvb-re
name: Dead or Alive Xtreme Beach Volleyball (doaxvb-re)
description: >-
  Native PC port of the Xbox game by static recompilation. Releases hold tools and
  source only: the game is built from your USA ISO.
source:
  type: github
  repo: NoRain211/doaxvb-re
  channel: stable
  auto_update: true
assets:
  # Windows: DOAXBV-<version>.zip bundles Python, CMake, Git and the ISO extractor (~107 MB).
  windows-x64: { match: '^DOAXBV-[0-9][0-9A-Za-z.]*(-rc[0-9]+)?\.zip$' }
  linux-x64: { match: '-Linux\.zip$' }
  macos-universal: { match: '-macOS\.zip$' }
input:
  kind: iso
  description: Dead or Alive Xtreme Beach Volleyball, USA Xbox ISO
platforms:
  windows-x64:
    strategy: client_build
    notes: >-
      First run downloads llvm-mingw (190 MB, ~715 MB unpacked) and DXC. Upstream
      advises building each update into a new folder and keeping the old one and its saves.
    steps:
      - download_artifact: { to: '{install}', extract: true }  # unpacks to DOAXBV-<version>/
      - place_input: { to: '{data}/doaxvb-re/game.iso' }
      - run: { command: 'BuildGame.cmd "{data}/doaxvb-re/game.iso"', cwd: '{install}' }
  linux-x64:
    strategy: client_build  # Phase 3: server_build in a builder container
    notes: >-
      Needs CMake, Ninja, clang or a C++17 compiler, Python 3 (venv), SDL3 build deps
      and libshaderc. SteamOS has no compiler: build in an Ubuntu 24.04 distrobox.
    steps:
      - download_artifact: { to: '{install}', extract: true }
      - place_input: { to: '{data}/doaxvb-re/game.iso' }
      - run: { command: './build_game.sh "{data}/doaxvb-re/game.iso"', cwd: '{install}' }
  macos-universal:
    strategy: client_build
    notes: Install the prerequisites in docs/building.md (macOS build) first.
    steps:
      - download_artifact: { to: '{install}', extract: true }
      - place_input: { to: '{data}/doaxvb-re/game.iso' }
      - run: { command: './build_game.sh "{data}/doaxvb-re/game.iso"', cwd: '{install}' }
saves:
  # <disc-root>/.recomp-storage/partition1/UDATA/, where disc-root is the folder of
  # the extracted disc the runner is pointed at.
  default: '{install}/private/imported-disc/.recomp-storage/partition1/UDATA'
launch:
  windows-x64: { exe: 'DOAXBV.exe' }
  linux-x64: { exe: 'launcher.sh' }
  macos-universal: { exe: 'launcher.sh' }
unverified:
  - saves  # disc-root location inside the install not confirmed
  - launch  # paths are relative to the unpacked DOAXBV-<version>/ folder
  - server_build.windows-x64  # cross-compiling the Windows runner with llvm-mingw on Linux
notes: >-
  The game builds into the release folder; keep the previous folder on update
  (upstream advice), so installs are per version.
