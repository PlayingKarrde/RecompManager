# Researched 2026-11-07 from the README and release v0.3.1. See docs/games/ultratears.md.
id: ultratears
name: UltraTears (Tears of the Kingdom)
description: >-
  Builds a native Tears of the Kingdom (1.4.3) for Windows, Linux and Steam Deck
  from your exefs/romfs dump. Building takes ~30 minutes, 16 GB RAM and ~40 GB disk.
game:
  id: tears-of-the-kingdom
  title: 'The Legend of Zelda: Tears of the Kingdom'
  system: switch
  identifiers:
    switch_program_id: 0100F2C0115B6000
source:
  type: github
  repo: kuraeow/ultratears
  channel: stable
  auto_update: true
assets:
  windows-x64: { match: '^UltraTears-.+-windows-x86_64\.zip$' }
  linux-x64: { match: '^UltraTears\.AppImage$' }  # Linux and Steam Deck
input:
  kind: folder
  description: Dump of Tears of the Kingdom at update 1.4.3 with exefs/ and romfs/ (~16 GB, ~304k files)
  verify:
    required_paths: [exefs/main, exefs/main.npdm, romfs]
platforms:
  windows-x64:
    strategy: client_build
    notes: >-
      In "UltraTears Launcher.exe" choose the dump folder and press "Prepare the
      game" (~30 minutes). "For Linux (Steam Deck)" also makes UltraTears-SteamDeck.tar (~28 GB).
    steps:
      - download_artifact: { to: '{install}', extract: true, strip_root: true }  # UltraTears-<version>-windows-x86_64/
      - place_input: { to: '{data}/ultratears/dump' }
      - instructions:
          markdown: >-
            Start **UltraTears Launcher.exe**, choose `{data}/ultratears/dump` and
            press **Prepare the game**.
  linux-x64:
    strategy: client_build  # Phase 3: server_build (needs 16 GB RAM, 40 GB disk on the server)
    notes: Needs kernel 6.7+, glibc 2.34+ and Vulkan 1.3. SteamOS 3 has all three.
    steps:
      - download_artifact: { to: '{install}/UltraTears.AppImage' }
      - chmod: { path: '{install}/UltraTears.AppImage', mode: '755' }
      - place_input: { to: '{data}/ultratears/dump' }
      - instructions:
          markdown: >-
            Run **UltraTears.AppImage**, choose `{data}/ultratears/dump` and press
            **Prepare the game**. Then add UltraTears.AppImage from the game folder
            to Steam with `--play` in its launch options.
saves:
  default: '{install}/userdata'  # kept across updates; never overwrite
launch:
  windows-x64: { exe: 'UltraTears Launcher.exe' }
  linux-x64: { exe: 'UltraTears.AppImage', args: ['--play'] }
unverified:
  - server_build  # tools/setup.py --dump <path> builds headlessly; untested in a container
  - launch.windows-x64  # exe name from the zip listing; not launched
notes: >-
  Report problems with ultratears.log from the game folder. The launcher finds
  new versions itself and rebuilds only what changed.
