[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "recompmanager"
version = "0.1.0"
description = "Self-hosted manager for game recompilations and decompilation ports"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "docker>=7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[project.scripts]
recompmanager = "recompmanager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["recompmanager"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
