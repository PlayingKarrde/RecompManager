# For developers: `alembic revision --autogenerate -m "..."` from the server/ folder.
# The app itself runs migrations on startup without this file.
[alembic]
script_location = recompmanager/migrations
sqlalchemy.url = sqlite:///./dev-config/recompmanager.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
